<!doctype html><meta charset=utf-8><title>remote-pager-card logic test</title>
<script>
window.loadCardHelpers = async () => ({ createCardElement: async (cfg) => { await new Promise(r => setTimeout(r, 5)); const d = document.createElement("div"); d.textContent = cfg.title; d.style.height = "100px"; return d; } });
</script>
<script src="../dist/remote-pager-card.js"></script>
<remote-pager-card id=p></remote-pager-card>
<script>
// Open in a browser (mobile-size window). window.__result is "PASS" or a message when the checks below are done (about 12 s).
(async () => {
  const wait = (ms) => new Promise(r => setTimeout(r, ms)), p = document.getElementById("p"), fail = [];
  p.setConfig({top: "0px", build_radius: 2, keep_radius: 5, pages: [{title: "A"}, {title: "B"}, {title: "C"}, {title: "D"}]});
  await wait(2000); const vp = p._vp, w = vp.clientWidth;
  const page = () => p._pages[p._slot()].textContent.trim();
  if (page() !== "A") fail.push("start page is " + page());
  for (let k = 1; k <= 6; k++) { vp.scrollTo({left: vp.scrollLeft + w, behavior: "instant"}); await wait(500); if (page() !== "ABCD"[k % 4]) fail.push("forward " + k + " shows " + page()); }
  for (let k = 1; k <= 6; k++) { vp.scrollTo({left: vp.scrollLeft - w, behavior: "instant"}); await wait(500); if (page() !== "ABCD"[(6 - k) % 4]) fail.push("backward " + k + " shows " + page()); }
  await wait(1500); if (p._cards.size > 11) fail.push("too many cards alive: " + p._cards.size);
  if (p._jumps) fail.push("unexpected jump: " + p._jumps);
  window.__result = fail.length ? "FAIL: " + fail.join("; ") : "PASS"; document.title = window.__result;
})();
</script>
